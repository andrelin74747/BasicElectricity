<title>基本電學題庫</title>
<style>
:root{--bg:#f3f5f7;--card:#ffffff;--text:#172033;--muted:#64748b;--border:#dbe2ea;--accent:#2563eb;--ok:#16a34a;--bad:#dc2626;--okbg:#ecfdf5;--badbg:#fef2f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--text:#e5edf7;--muted:#94a3b8;--border:#334155;--okbg:#052e1c;--badbg:#3a1414}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--text:#e5edf7;--muted:#94a3b8;--border:#334155;--okbg:#052e1c;--badbg:#3a1414}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei",Arial,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:680px;padding:20px 16px 40px}
header h1{font-size:19px;margin:0 0 4px} header p{margin:0;color:var(--muted);font-size:13px}
.progress{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:12px}
.progress-bar{height:100%;background:var(--accent);width:0%;transition:width .25s}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-top:16px}
.meta{color:var(--muted);font-size:12px;margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap}
.qtext{font-size:16px;line-height:1.7;margin:0 0 16px}
.qimg{max-width:100%;border:1px solid var(--border);border-radius:8px;margin-bottom:14px}
.choice{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:9px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text);font-size:14.5px;cursor:pointer}
.choice.correct{border-color:var(--ok);background:var(--okbg)} .choice.wrong{border-color:var(--bad);background:var(--badbg)}
.explain{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--border);font-size:13.5px;line-height:1.7;display:none}
.explain.show{display:block} .explain b{color:var(--accent)}
.navbtns{display:flex;gap:10px;margin-top:16px}
button.nav{flex:1;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button.nav.secondary{background:transparent;color:var(--text);border:1px solid var(--border)}
button.nav:disabled{opacity:.4}
.result{text-align:center;padding:30px 20px} .result .score{font-size:44px;font-weight:800;color:var(--accent);margin:10px 0}
footer{margin-top:18px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
sup,sub{font-size:75%}

let order=[...Array(Q.length).keys()], idx=0, score=0, answered=new Array(Q.length).fill(null);
const area=document.getElementById("quizArea"), bar=document.getElementById("bar"), sub=document.getElementById("sub");
function render(){
  if(idx>=order.length){renderResult();return;}
  const q=Q[order[idx]];
  sub.textContent=`第 ${idx+1} / ${order.length} 題`;
  bar.style.width=(idx/order.length*100)+"%";
  const img = q.img? `<img class="qimg" src="${q.img}">` : "";
  const choiceHtml = q.img
    ? "ABCDEF".slice(0, Math.max(5, "ABCDEF".indexOf(q.a)+1)).split("").map(k=>`<button class="choice" data-k="${k}">(${k})</button>`).join("")
    : Object.entries(q.c).map(([k,v])=>`<button class="choice" data-k="${k}">(${k}) ${v}</button>`).join("");
  area.innerHTML=`<div class="card">
    <div class="meta"><span>第 ${q.n} 題</span>${q.d?`<span>難易度 ${"★".repeat(q.d)}</span>`:""}${q.s?`<span>${q.s}</span>`:""}</div>
    ${q.t?`<p class="qtext">${q.t}</p>`:""}${img}
    ${choiceHtml}
    <div class="explain" id="explain"></div>
    <div class="navbtns"><button class="nav secondary" id="prevBtn" ${idx===0?"disabled":""}>上一題</button>
      <button class="nav" id="nextBtn" style="display:none">下一題</button></div></div>`;
  area.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",onPick));
  document.getElementById("prevBtn").addEventListener("click",()=>{idx--;render();});
  document.getElementById("nextBtn").addEventListener("click",()=>{idx++;render();});
  const a=answered[order[idx]]; if(a) reveal(a.picked,q,a.correct);
}
function onPick(e){const picked=e.currentTarget.dataset.k,q=Q[order[idx]],correct=picked===q.a;
  if(answered[order[idx]]===null && correct) score++;
  answered[order[idx]]={picked,correct}; reveal(picked,q,correct);}
function reveal(picked,q,correct){
  area.querySelectorAll(".choice").forEach(b=>{b.disabled=true;
    if(b.dataset.k===q.a)b.classList.add("correct"); else if(b.dataset.k===picked)b.classList.add("wrong");});
  const exp=document.getElementById("explain");
  const expImgHtml = q.eimg ? `<br><img class="qimg" src="${q.eimg}">` : "";
  exp.innerHTML=`<b>${correct?"答對了！":"正確答案是 ("+q.a+")"}</b>`+(q.e?`<br>${q.e}`:"")+expImgHtml;
  exp.classList.add("show"); document.getElementById("nextBtn").style.display="block";
}
function renderResult(){bar.style.width="100%";sub.textContent="完成";
  const c=answered.filter(a=>a).length;
  area.innerHTML=`<div class="card result"><div>作答完成</div><div class="score">${score} / ${c}</div></div>`;}
render();
