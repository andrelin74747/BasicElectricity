let order=[...Array(Q.length).keys()], idx=0, score=0, answered=new Array(Q.length).fill(null);
const area=document.getElementById("quizArea"), bar=document.getElementById("bar"), sub=document.getElementById("sub");
function render(){
  if(idx>=order.length){renderResult();return;}
  const q=Q[order[idx]];
  sub.textContent=`第 ${idx+1} / ${order.length} 題`;
  bar.style.width=(idx/order.length*100)+"%";
  const img = q.img? `<img class="qimg" src="${q.img}">` : "";
  const choiceHtml = q.img
    ? "ABCDEF".slice(0, Math.max(5, "ABCDEF".indexOf(q.a)+1)).split("").map(k=>`<button class="choice" data-k="${k}">(${k})</button>`).join("")
    : Object.entries(q.c).map(([k,v])=>`<button class="choice" data-k="${k}">(${k}) ${v}</button>`).join("");
  area.innerHTML=`<div class="card">
    <div class="meta"><span>第 ${q.n} 題</span>${q.d?`<span>難易度 ${"★".repeat(q.d)}</span>`:""}${q.s?`<span>${q.s}</span>`:""}</div>
    ${q.t?`<p class="qtext">${q.t}</p>`:""}${img}
    ${choiceHtml}
    <div class="explain" id="explain"></div>
    <div class="navbtns"><button class="nav secondary" id="prevBtn" ${idx===0?"disabled":""}>上一題</button>
      <button class="nav" id="nextBtn" style="display:none">下一題</button></div></div>`;
  area.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",onPick));
  document.getElementById("prevBtn").addEventListener("click",()=>{idx--;render();});
  document.getElementById("nextBtn").addEventListener("click",()=>{idx++;render();});
  const a=answered[order[idx]]; if(a) reveal(a.picked,q,a.correct);
}
function onPick(e){const picked=e.currentTarget.dataset.k,q=Q[order[idx]],correct=picked===q.a;
  if(answered[order[idx]]===null && correct) score++;
  answered[order[idx]]={picked,correct}; reveal(picked,q,correct);}
function reveal(picked,q,correct){
  area.querySelectorAll(".choice").forEach(b=>{b.disabled=true;
    if(b.dataset.k===q.a)b.classList.add("correct"); else if(b.dataset.k===picked)b.classList.add("wrong");});
  const exp=document.getElementById("explain");
  const expImgHtml = q.eimg ? `<br><img class="qimg" src="${q.eimg}">` : "";
  exp.innerHTML=`<b>${correct?"答對了！":"正確答案是 ("+q.a+")"}</b>`+(q.e?`<br>${q.e}`:"")+expImgHtml;
  exp.classList.add("show"); document.getElementById("nextBtn").style.display="block";
}
function renderResult(){bar.style.width="100%";sub.textContent="完成";
  const c=answered.filter(a=>a).length;
  area.innerHTML=`<div class="card result"><div>作答完成</div><div class="score">${score} / ${c}</div></div>`;}
render();
</script></body></html>
